version: '3.8'

services:
  backend:
    build: ./backend
    container_name: weatherroute_backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: weatherroute_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
